name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-backend:
    name: Deploy API to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT }} ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload backend files
        run: |
          rsync -avz --delete \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude 'uploads/' \
            --exclude '.git/' \
            --exclude '*.log' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.CPANEL_SSH_PORT }}" \
            ./server/ \
            ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}:~/api/

      - name: Post-deploy (install, migrate, seed, restart)
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          JWT: ${{ secrets.JWT_SECRET }}
          SESSION: ${{ secrets.SESSION_SECRET }}
          G_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          G_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_H: ${{ secrets.SMTP_HOST }}
          SMTP_P: ${{ secrets.SMTP_PORT }}
          SMTP_U: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_F: ${{ secrets.SMTP_FROM }}
          IK_PUB: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
          IK_PRIV: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IK_URL: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.CPANEL_SSH_PORT }} \
              ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }} \
              "bash -s" << ENDSSH
            set -e
            export PATH=/opt/alt/alt-nodejs22/root/usr/bin:\$HOME/npm-global/bin:\$PATH

            cd ~/api

            echo "Writing .env..."
            cat > .env << EOF
PORT=5000
NODE_ENV=production
CLIENT_ORIGIN=https://mindfulmeditationretreat.org
SERVER_ORIGIN=https://api.mindfulmeditationretreat.org
DATABASE_URL=${DB_URL}
JWT_SECRET=${JWT}
JWT_EXPIRES_IN=7d
SESSION_SECRET=${SESSION}
GOOGLE_CLIENT_ID=${G_ID}
GOOGLE_CLIENT_SECRET=${G_SECRET}
SMTP_HOST=${SMTP_H}
SMTP_PORT=${SMTP_P}
SMTP_USER=${SMTP_U}
SMTP_PASS=${SMTP_PASS}
SMTP_FROM=${SMTP_F}
IMAGEKIT_PUBLIC_KEY=${IK_PUB}
IMAGEKIT_PRIVATE_KEY=${IK_PRIV}
IMAGEKIT_URL_ENDPOINT=${IK_URL}
UPLOAD_DIR=uploads
MAX_UPLOAD_MB=25
EOF

            echo "npm install..."
            npm install --omit=dev

            echo "Prisma generate..."
            npx prisma generate

            echo "Prisma migrate..."
            npx prisma migrate deploy

            echo "Prisma seed..."
            npx prisma db seed || echo "Seed skipped"

            echo "PM2 restart..."
            if pm2 list | grep -q "mindfull-api"; then
              pm2 restart mindfull-api --update-env
            else
              pm2 start ecosystem.config.js --env production
              pm2 save --force
            fi

            echo "Deployment complete!"
          ENDSSH
