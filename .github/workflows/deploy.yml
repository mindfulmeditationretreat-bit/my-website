name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-backend:
    name: Deploy API to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect what changed
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^server/db/migrations/'; then
            echo "migrations=true" >> $GITHUB_OUTPUT
          else
            echo "migrations=false" >> $GITHUB_OUTPUT
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q '^server/db/seed\.js'; then
            echo "seed=true" >> $GITHUB_OUTPUT
          else
            echo "seed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT }} ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Package server files
        run: |
          tar --exclude='server/node_modules' \
              --exclude='server/.env' \
              --exclude='server/uploads' \
              --exclude='server/.git' \
              --exclude='server/*.log' \
              -czf /tmp/api.tar.gz -C server .

      - name: Upload archive to server
        run: |
          scp -i ~/.ssh/deploy_key \
              -P ${{ secrets.CPANEL_SSH_PORT }} \
              /tmp/api.tar.gz \
              ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}:~/api.tar.gz

      - name: Write .env and upload
        run: |
          printf 'PORT=5050\n' > /tmp/production.env
          printf 'NODE_ENV=production\n' >> /tmp/production.env
          printf 'CLIENT_ORIGIN=https://mindfulmeditationretreat.org\n' >> /tmp/production.env
          printf 'SERVER_ORIGIN=https://api.mindfulmeditationretreat.org\n' >> /tmp/production.env
          printf 'COOKIE_DOMAIN=.mindfulmeditationretreat.org\n' >> /tmp/production.env
          printf 'JWT_EXPIRES_IN=7d\n' >> /tmp/production.env
          printf 'UPLOAD_DIR=uploads\n' >> /tmp/production.env
          printf 'MAX_UPLOAD_MB=25\n' >> /tmp/production.env
          printf 'DATABASE_URL=%s\n' "${{ secrets.DATABASE_URL }}" >> /tmp/production.env
          printf 'JWT_SECRET=%s\n' "${{ secrets.JWT_SECRET }}" >> /tmp/production.env
          printf 'SESSION_SECRET=%s\n' "${{ secrets.SESSION_SECRET }}" >> /tmp/production.env
          printf 'GOOGLE_CLIENT_ID=%s\n' "${{ secrets.GOOGLE_CLIENT_ID }}" >> /tmp/production.env
          printf 'GOOGLE_CLIENT_SECRET=%s\n' "${{ secrets.GOOGLE_CLIENT_SECRET }}" >> /tmp/production.env
          printf 'SMTP_HOST=%s\n' "${{ secrets.SMTP_HOST }}" >> /tmp/production.env
          printf 'SMTP_PORT=%s\n' "${{ secrets.SMTP_PORT }}" >> /tmp/production.env
          printf 'SMTP_USER=%s\n' "${{ secrets.SMTP_USER }}" >> /tmp/production.env
          printf 'SMTP_PASS=%s\n' "${{ secrets.SMTP_PASS }}" >> /tmp/production.env
          printf 'SMTP_FROM=%s\n' "${{ secrets.SMTP_FROM }}" >> /tmp/production.env
          printf 'IMAGEKIT_PUBLIC_KEY=%s\n' "${{ secrets.IMAGEKIT_PUBLIC_KEY }}" >> /tmp/production.env
          printf 'IMAGEKIT_PRIVATE_KEY=%s\n' "${{ secrets.IMAGEKIT_PRIVATE_KEY }}" >> /tmp/production.env
          printf 'IMAGEKIT_URL_ENDPOINT=%s\n' "${{ secrets.IMAGEKIT_URL_ENDPOINT }}" >> /tmp/production.env
          scp -i ~/.ssh/deploy_key \
              -P ${{ secrets.CPANEL_SSH_PORT }} \
              /tmp/production.env \
              ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}:~/api/.env

      - name: Extract files and install dependencies
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.CPANEL_SSH_PORT }} \
              ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }} \
              'cd ~ && tar -xzf api.tar.gz -C ~/api && rm api.tar.gz && cd ~/api && /opt/alt/alt-nodejs20/root/usr/bin/npm install --omit=dev && echo "Install done"'

      - name: Run SQL migrations
        if: steps.changes.outputs.migrations == 'true'
        run: |
          echo "New migrations detected — running migrate.sh"
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.CPANEL_SSH_PORT }} \
              ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }} \
              'cd ~/api && bash db/migrate.sh'

      - name: Seed database
        if: steps.changes.outputs.seed == 'true'
        run: |
          echo "seed.js changed — running seeder"
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.CPANEL_SSH_PORT }} \
              ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }} \
              'cd ~/api && /opt/alt/alt-nodejs20/root/usr/bin/node db/seed.js'

      - name: Restart app via PM2
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.CPANEL_SSH_PORT }} \
              ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }} \
              'PM2=/home/mindful1/npm-global/bin/pm2 && NODE=/opt/alt/alt-nodejs20/root/usr/bin/node && cd ~/api && $PM2 delete mindfull-api 2>/dev/null || true && $PM2 start src/index.js --name mindfull-api --interpreter $NODE && $PM2 save --force && echo "Restarted"'
