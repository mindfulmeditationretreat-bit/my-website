name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-backend:
    name: Deploy API to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT }} ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload backend files
        run: |
          rsync -avz --delete \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude 'uploads/' \
            --exclude '.git/' \
            --exclude '*.log' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.CPANEL_SSH_PORT }}" \
            ./server/ \
            ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}:~/api/

      - name: Write .env file
        run: |
          cat > /tmp/production.env << 'EOF'
          PORT=5000
          NODE_ENV=production
          CLIENT_ORIGIN=https://mindfulmeditationretreat.org
          SERVER_ORIGIN=https://api.mindfulmeditationretreat.org
          JWT_EXPIRES_IN=7d
          UPLOAD_DIR=uploads
          MAX_UPLOAD_MB=25
          EOF
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> /tmp/production.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /tmp/production.env
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> /tmp/production.env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> /tmp/production.env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> /tmp/production.env
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> /tmp/production.env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> /tmp/production.env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> /tmp/production.env
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> /tmp/production.env
          echo "SMTP_FROM=${{ secrets.SMTP_FROM }}" >> /tmp/production.env
          echo "IMAGEKIT_PUBLIC_KEY=${{ secrets.IMAGEKIT_PUBLIC_KEY }}" >> /tmp/production.env
          echo "IMAGEKIT_PRIVATE_KEY=${{ secrets.IMAGEKIT_PRIVATE_KEY }}" >> /tmp/production.env
          echo "IMAGEKIT_URL_ENDPOINT=${{ secrets.IMAGEKIT_URL_ENDPOINT }}" >> /tmp/production.env
          scp -i ~/.ssh/deploy_key -P ${{ secrets.CPANEL_SSH_PORT }} \
            /tmp/production.env \
            ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}:~/api/.env

      - name: Post-deploy (install, migrate, seed, restart)
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.CPANEL_SSH_PORT }} \
              ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }} \
              'export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$HOME/npm-global/bin:$PATH && cd ~/api && npm install --omit=dev && npx prisma generate && npx prisma migrate deploy && (npx prisma db seed || echo "Seed skipped") && (pm2 restart mindfull-api --update-env || pm2 start ecosystem.config.js --env production) && pm2 save --force && echo "Deployment complete!"'
